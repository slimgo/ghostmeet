name: CI

# CI собирает и прогоняет тесты — и никогда не подписывает.
#
# Подпись остаётся на машине разработчика: разрешения macOS привязаны к подписи, а сертификат у
# проекта личный (Apple Development, не Developer ID). Отдать его закрытую часть в secrets значит
# разрешить подписывать этим именем всякому, кто получит доступ к репозиторию. Релиз выпускает
# scripts/release.sh локально — см. docs/releasing.md.

on:
  push:
    # Все ветки, а не только main. Работа идёт в feat/*, и ветки пушатся именно
    # ради этого прогона: пока фича не влита, CI — единственное место, где она
    # собирается на чистой машине. С фильтром по main ветка уезжала на GitHub и
    # не проверялась ничем, о чём никто не узнавал — прогона просто не было.
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

# `pull_request` здесь нет намеренно: ветки живут в этом же репозитории, и push
# их уже покрыл — второй триггер давал бы два прогона на один коммит и жёг бы
# macOS-раннер вдвое. Вернуть его стоит, когда появится первый PR из форка:
# чужую ветку push отсюда не видит.

# Новый push в ту же ветку отменяет предыдущий прогон: macOS-раннеры дорогие и медленные,
# а результат устаревшего коммита никому не нужен.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT: GhostMeet/GhostMeet.xcodeproj

jobs:
  test:
    name: Сборка и тесты
    # Не macos-latest. Тот сейчас разрешается в macOS 15, где Xcode по умолчанию
    # 16.4, а SWIFT_DEFAULT_ACTOR_ISOLATION — настройка Swift 6.2, и проект на
    # нём не собирается вовсе. Падает это на компиляции, до первого теста, и со
    # стороны выглядит как «упали тесты».
    runs-on: macos-26
    # Прогон целиком укладывается в единицы минут; час — это защита от зависшего host-процесса,
    # а не запас на рост. Без него повисший тест-хост жёг бы раннер до общего лимита.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # Новейший из установленных, а не прибитый гвоздями путь: образы
      # обновляются, конкретную версию однажды снимут, и прибитый путь сломает
      # сборку молча. Выбор печатается аннотацией (`::notice::`), а не только в
      # лог: аннотации видны через открытый API, а логи Actions без токена — нет,
      # и именно на этом диагностика первого падения встала.
      - name: Xcode поновее
        run: |
          set -euo pipefail
          newest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$newest" ]; then
            sudo xcode-select -s "$newest"
          fi
          echo "::notice title=Xcode::$(xcodebuild -version | tr '\n' ' ')"
          echo "::notice title=Swift::$(swift --version 2>&1 | head -1)"
          echo "::notice title=macOS::$(sw_vers -productVersion)"

      - name: Окружение
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      # Пакеты кладутся в каталог внутри рабочей копии, а не в DerivedData: так их путь известен
      # заранее и его можно закешировать.
      - name: Кеш зависимостей SPM
        uses: actions/cache@v4
        with:
          path: .spm
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Перевод на месте
        # Раньше тестов, потому что дешевле: строка, которую забыли обернуть в
        # String(localized:), не падает и не пустеет — она просто выходит
        # по-русски на английском экране. Один релиз так и уехал.
        run: ./scripts/find-untranslated.sh

      - name: Тесты
        run: |
          set -o pipefail
          # Каталог создаётся здесь, а не появляется сам: он в .gitignore, на
          # свежем checkout его нет, а `tee` открывает файл раньше, чем
          # xcodebuild создаст derived data. Без этой строки конвейер умирает на
          # первой строке вывода, лог не пишется вовсе — и падение выглядит как
          # «упали тесты», не оставив ни одной строки о причине.
          mkdir -p .build
          xcodebuild \
            -project "$PROJECT" \
            -scheme GhostMeet \
            -destination 'platform=macOS' \
            -derivedDataPath .build/ci-derived \
            -clonedSourcePackagesDirPath .spm \
            -resultBundlePath .build/ci-result.xcresult \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= \
            test 2>&1 | tee .build/ci-tests.log

      # «✔ Test run with 0 tests in N suites passed» с кодом возврата 65 — это упавший host, а не
      # успех: сюиты объявились, приложение умерло раньше первого теста, и их ноль тестов честно
      # не упал. Строка выглядит зелёной, и один раз уже была принята за зелёный прогон.
      #
      # Подпись ad-hoc (CODE_SIGN_IDENTITY=-) здесь обязательна: на Apple silicon неподписанный
      # бинарник не запускается вовсе, а тесты хостятся внутри GhostMeet.app.
      - name: Прогон был настоящим
        if: always()
        run: |
          # Причина падения выкладывается аннотациями, а не только в лог: логи
          # Actions без токена репозитория не читаются вовсе, аннотации —
          # читаются открытым API. На этом встала диагностика первых двух
          # падений, и это тот случай, когда шаг существует ради того, кто будет
          # чинить, а не ради того, кто смотрит на галочку.
          #
          # Ошибки берутся из .xcresult, а не из лога: бандл пишет сам
          # xcodebuild, и он переживает даже потерю конвейера — ровно так
          # нашлась настоящая причина, когда лога не существовало.
          python3 scripts/xcresult-errors.py .build/ci-result.xcresult

          # Три исхода, и первая версия этого шага различала только один. «Сборка
          # не собралась» проходило молча, потому что последней командой в
          # конвейере стоял `tail`, а он доволен и пустым вводом.
          if [ ! -f .build/ci-tests.log ]; then
            echo "::error::Лога прогона нет — конвейер упал раньше первой строки вывода"
            exit 1
          fi

          if grep -q "Test run with 0 tests" .build/ci-tests.log; then
            echo "::error::Ноль тестов — host-приложение упало на старте, а не «всё прошло»"
            exit 1
          fi

          summary=$(grep -oE "Test run with [0-9]+ tests? in [0-9]+ suites?" .build/ci-tests.log | tail -1 || true)
          if [ -z "$summary" ]; then
            echo "::error::Тесты не запускались вовсе — упала сборка"
            exit 1
          fi

          echo "::notice title=Тесты::$summary"
          echo "$summary"

      # Отчёт о падении host-процесса — единственное, что отвечает на вопрос
      # «почему ноль тестов». Собирается рядом с логами, потому что искать его
      # постфактум негде: раннер уничтожается вместе с ответом.
      - name: Отчёт о падении, если host умер
        if: failure()
        run: |
          mkdir -p .build/crashes
          cp ~/Library/Logs/DiagnosticReports/GhostMeet-*.ips .build/crashes/ 2>/dev/null || true
          count=$(ls .build/crashes 2>/dev/null | wc -l | tr -d ' ')
          if [ "$count" = 0 ]; then
            echo "::notice title=Падения::Отчётов о падении нет — host не падал, дело в чём-то другом"
          else
            echo "::error title=Падения::Host падал, отчётов: $count. Первые строки ниже"
            head -30 .build/crashes/*.ips | sed 's/^/  /'
          fi

      - name: Логи прогона
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            .build/ci-tests.log
            .build/ci-result.xcresult
            .build/crashes
          retention-days: 7

  version:
    name: Версия и CHANGELOG
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Версия читается из pbxproj текстом, без xcodebuild: ради одной строки поднимать
      # macOS-раннер незачем.
      - name: Версия согласована
        run: |
          set -euo pipefail
          PBXPROJ=GhostMeet/GhostMeet.xcodeproj/project.pbxproj
          VERSION=$(grep -m1 -oE 'MARKETING_VERSION = [^;]+' "$PBXPROJ" | cut -d' ' -f3)
          COUNT=$(grep -c "MARKETING_VERSION = $VERSION;" "$PBXPROJ")

          echo "MARKETING_VERSION = $VERSION (в $COUNT конфигурациях)"

          # Четыре — это два таргета × Debug/Release. Меньше значит, что версию проставили
          # частично, и приложение с тестами разъедутся по версиям.
          if [ "$COUNT" -ne 4 ]; then
            echo "::error::MARKETING_VERSION проставлен в $COUNT конфигурациях из четырёх"
            exit 1
          fi

          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "::error::В CHANGELOG.md нет раздела ## [$VERSION]"
            exit 1
          fi

          # На теге проверка строже: тег, разошедшийся с версией внутри приложения, — это релиз,
          # который невозможно опознать по бандлу.
          if [ "${GITHUB_REF_TYPE:-}" = tag ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$TAG" != "$VERSION" ]; then
              echo "::error::Тег $GITHUB_REF_NAME не совпадает с версией проекта $VERSION"
              exit 1
            fi
            echo "Тег $GITHUB_REF_NAME совпадает с версией проекта"
          fi
